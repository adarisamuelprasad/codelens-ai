spring.application.name=codelens-api
server.port=${PORT:8082}
management.endpoints.web.exposure.include=health

# PostgreSQL in production (DATABASE_URL etc.); an H2 file database by default
# so a local run needs no database server. Flyway owns the schema.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/codelens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Every admin route needs X-Admin-Key. Unset = admin routes answer 503.
codelens.admin-key=${CODELENS_ADMIN_KEY:}

# GitHub. Webhook secret is required for the webhook to accept anything.
# Either a GitHub App (app id + private key, PKCS#1 or PKCS#8 PEM) or a static
# token; neither = anonymous reads of public repos and no PR comments.
codelens.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
codelens.github.app-id=${GITHUB_APP_ID:}
codelens.github.private-key=${GITHUB_APP_PRIVATE_KEY:}
codelens.github.token=${GITHUB_TOKEN:}
codelens.github.post-comments=${CODELENS_POST_COMMENTS:true}

codelens.analysis.max-files=100
codelens.analysis.max-file-bytes=300000
codelens.analysis.max-findings=50

# ai-service (Python). Either unset = findings are stored without AI text.
codelens.ai.url=${CODELENS_AI_URL:}
codelens.ai.key=${CODELENS_AI_KEY:}
codelens.ai.timeout-seconds=90
codelens.ai.max-findings=15
